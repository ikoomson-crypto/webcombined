<div id="assignmentsView" style="display:none;">
    <div class="container-main">
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-2">
            <h1>
                <i class="fas fa-undo-alt" style="color:#4f46e5;"></i>
                Process Return
                <span class="company-badge" id="assignmentsCompanyBadge">Loading...</span>
            </h1>
            <button class="btn btn-sm btn-outline-primary" onclick="loadAssignments()">
                <i class="fas fa-sync-alt"></i> Refresh
            </button>
        </div>
        <p class="text-muted">View active assignments and process asset returns.</p>

        <div class="table-responsive">
            <table id="assignmentsTable" class="table table-striped" style="width:100%">
                <thead>
                    <tr>
                        <th>Asset No.</th>
                        <th>Description</th>
                        <th>Assigned To</th>
                        <th>Assigned By</th>
                        <th>Assigned Date</th>
                        <th>Expected Return</th>
                        <th>Actual Return</th>
                        <th>Status</th>
                        <th>Notes</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
</div>
